<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - ReHabit AI</title>
    <link rel="stylesheet" href="jsy\static\login_signup_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="logo">
            <a href="#">
                <span class="logo-icon">~</span> ReHabit AI
            </a>
        </div>
        <div class="form-container">
            <h2>로그인</h2>
            <p class="subtitle">다시 오신 것을 환영합니다!</p>
            <form id="loginForm">
                <div class="input-group">
                    <input type="email" id="email" placeholder="이메일" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="비밀번호" required>
                </div>
                <button type="submit">로그인</button>
            </form>
            <div class="switch-form">
                <p>계정이 없으신가요? <a href="signup.html">회원가입</a></p>
            </div>
        </div>
    </div>
    <script src="/jsy/static/script.js"></script>
</body>
</html>
