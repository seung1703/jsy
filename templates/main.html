<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>정자세연구소</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
  <script src="main.js" defer></script>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="logo">
        <div class="mark">ㅈㅅㅇ</div>
        <div style="font-weight:700">정자세연구소</div>
      </div>

      <nav aria-label="주요 메뉴">
        <a href="#" id="home-link">홈</a>
        <a href="#" id="ai-link">AI 코칭</a>
        <a href="#" id="health-link">건강 정보</a>
        <a href="#" id="progress-link">내 진행상황</a>
      </nav>

      <div class="auth">
        <button class="btn outline" id="login-btn">로그인</button>
        <button class="btn primary" id="signup-btn">회원가입</button> <!-- 화원->회원으로 수정 권장 -->
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="hero-left">
          <h1>당신의 AI 기반<br><span class="accent">재활 코치</span></h1>
          <p class="lead">지능형 비디오 분석, 맞춤형 피드백 및 전문가 지도로 회복 여정을 혁신하세요~</p>
          <div class="cta-row">
            <button class="btn primary" id="coaching-btn">코칭 시작하기</button>
            <button class="btn outline" id="healthinfo-btn">건강 정보 둘러보기</button> <!-- outlint -> outline 고침 -->
          </div>
        </div>

        <div class="hero-right">
          <div class="img-card">
            <!-- image src=".png" alt="재활 이미지" -->
          </div>
        </div>
      </section>

      <section class="sub">
        <h2>회복에 필요한 모든 것</h2>
        <p>재활 여정을 지원하는 포괄적인 도구와 인사이트</p>
      </section>
    </main>
  </div>
</body>
</html>
