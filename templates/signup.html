<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - ReHabit AI</title>
    <link rel="stylesheet" href="/jsy/static/login_signup_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="logo">
            <a href="#">
                <span class="logo-icon">~</span> ReHabit AI
            </a>
        </div>
        <div class="form-container">
            <h2>회원가입</h2>
            <p class="subtitle">ReHabit AI와 함께 건강한 회복 여정을 시작하세요.</p>
            <form id="signupForm">
                <div class="input-group">
                    <input type="text" id="name" placeholder="이름" required>
                </div>
                <div class="input-group">
                    <input type="email" id="email" placeholder="이메일" required>
                </div>
                <div class="input-group date-input-container">
                    <input type="date" id="birthdate" required>
                    <span class="date-placeholder">연도 - 월 - 일</span>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="비밀번호 (8자 이상)" required>
                </div>
                <div class="input-group">
                    <input type="password" id="confirm-password" placeholder="비밀번호 확인" required>
                </div>
                <button type="submit">가입하기</button>
            </form>
            <div class="switch-form">
                <p>이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
            </div>
        </div>
    </div>
    <script src="/jsy/static/script.js"></script>
</body>
</html>
